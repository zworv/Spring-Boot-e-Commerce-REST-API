spring:
  application:
    name: ECommerce
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true
    username: root
    password: springboot
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always

server:
  port: 8080

admin:
  username: admin
  password: admin

jwt:
  expiration: 3600000

logging:
  level:
    org:
      springframework:
        security: # DEBUG
        data:
          jpa:
            repository:
              query: # DEBUG
      hibernate:
        SQL: # DEBUG